name: Linux Ubuntu

on:
  push:
    branches: [ master ]
  pull_request:
    types:
      - opened
      - reopened
      - synchronize

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install --yes \
            cmake \
            ninja-build \
            libgl1-mesa-dev \
            libgl1-mesa-dri \
            libx11-dev \
            libxrandr-dev \
            libxcursor-dev \
            libxi-dev \
            libudev-dev \
            xvfb \
            xauth

      - name: Configure CMake
        run: |
          cmake -S . -B build -G Ninja

      - name: Build Project
        run: cmake --build build --parallel

      - name: Run tests
        run: |
          # Keep Xvfb from resetting when the last test context disconnects between tests.
          xvfb-run --auto-servernum --error-file=/dev/stderr \
            --server-args="-screen 0 1280x1024x24 -noreset" \
            ctest --test-dir build --output-on-failure -V

